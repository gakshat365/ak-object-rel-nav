# DAgger Configuration for ObjectReact with Backward Failure Recovery

iterations:
  0:
    beta: 1.0
    model: "baseline_model"
  1:
    beta: 0.6
    model: "iter_0"
  2:
    beta: 0.4
    model: "iter_1"
  3:
    beta: 0.0
    model: "iter_2"

failure_recovery:
  stuck_radius: 0.2            # 0.2m radius for trapped condition
  consecutive_steps: 20        # 20 consecutive steps
  lead_in_steps: 50            # Backtrack 50 steps before trapped failure state
  trapped_manifest: "dagger/data/trapped_cases_manifest.csv"
  trapped_cases_dir: "dagger/data/trapped_cases"

rollout:
  max_steps: 300
  threshold_goal_distance: 1.0
  time_delta: 0.25
  step_size: 0.25

paths:
  initial_data: "dagger/data/initial_data"
  data_root: "dagger/data"
  model_root: "dagger/model"
  hm3d_root: "data/hm3d_v0.2"
  controller_config: "dagger/model/baseline_model/config.yaml"

training:
  batch_size: 16
  epochs: 5
  lr: 0.0001
  device: "cuda"
  val_fraction: 0.1
