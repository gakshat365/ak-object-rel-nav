[workspace]
authors = ["Rahul Vimalkanth"]
channels = ["conda-forge"]
name = "object-rel-nav"
platforms = ["linux-64"]
version = "0.1.0"

[activation]
scripts = ["scripts/activate.sh"]

[tasks]
map = "python -m libs.mapper.create_topomap"
nav = "python run_nav.py"

clone-habitat = """
(git clone https://github.com/facebookresearch/habitat-sim.git libs/habitat-sim && cd libs/habitat-sim && git checkout v0.2.4) || echo 'habitat-sim already cloned' && \
(git clone https://github.com/facebookresearch/habitat-lab.git libs/habitat-lab && cd libs/habitat-lab && git checkout v0.2.4) || echo 'habitat-lab already cloned'
"""

install-habitat = { cmd = """
cd libs/habitat-sim && rm -rf build/ && python -m pip install . -v --no-build-isolation && \
cd ../habitat-lab && python -m pip install -e habitat-lab
""", env = { WITH_BULLET = "1", HEADLESS = "1", CMAKE_POLICY_VERSION_MINIMUM = "3.5" } }

setup-habitat = { depends-on = ["clone-habitat", "install-habitat"] }

clean-habitat = """
rm -rf libs/habitat-sim libs/habitat-lab && \
python -m pip uninstall habitat-sim habitat-lab habitat -y || true\
pip cache purge || true && \
rm -rf /tmp/pip-* || true && \
echo 'Cleaned up habitat-sim and habitat-lab'
"""

reinstall-habitat = { depends-on = ["clean-habitat", "setup-habitat"] }

install-pyg = "python -m pip install torch-cluster torch-scatter torch-sparse -f https://data.pyg.org/whl/torch-2.5.1+cu118.html"

install-ros = "python -m pip install rosbag roslz4 --extra-index-url https://rospypi.github.io/simple/"

install-warmup-scheduler = "python -m pip install git+https://github.com/ildoonet/pytorch-gradual-warmup-lr.git"

verify = """
python -c "
import numpy as np
print(f'NumPy: {np.__version__}')
assert np.__version__.startswith('1.26'), f'NumPy must be 1.26.x, got {np.__version__}'
import habitat_sim
print(f'habitat_sim: {habitat_sim.__version__}')
print(f'Bullet physics: {habitat_sim.built_with_bullet}')
spec = habitat_sim.CameraSensorSpec()
spec.uuid = 'test'
print('CameraSensorSpec: OK')
import torch
print(f'PyTorch: {torch.__version__}')
print(f'CUDA available: {torch.cuda.is_available()}')
import cv2
print(f'OpenCV: {cv2.__version__}')
print('\\n✅ Core checks passed!')
"
"""

init = { depends-on = ["setup-habitat"], cmd = """
echo '=== Step 2/5: Installing PyG extensions ===' && \
pixi run install-pyg && \
echo '=== Step 3/5: Installing ROS packages ===' && \
pixi run install-ros && \
echo '=== Step 4/5: Installing warmup scheduler ===' && \
pixi run install-warmup-scheduler && \
echo '=== Step 5/5: Verifying installation ===' && \
pixi run verify && \
echo '' && \
echo '============================================' && \
echo '✅ INIT COMPLETE! Environment is ready.' && \
echo '============================================'
""" }

clean-all = """
echo 'Cleaning habitat...' && \
rm -rf libs/habitat-sim libs/habitat-lab .pixi pixi.lock && \
pip uninstall habitat-sim habitat-lab habitat magnum -y || true && \
pip cache purge || true && \
rm -rf /tmp/pip-* || true && \
echo 'Done! Now run: pixi install && pixi run init'
"""

[dependencies]
python = "3.10.*"
cmake = ">=3.14"
ninja = "*"
git = "*"
pip = "*"
numpy = ">=1.26,<1.27"
libstdcxx-ng = ">=12"
eigen = "*"
bullet = "*"
libgl = "*"
libglu = "*"
python-blosc2 = ">=2.7.1,<3"
networkx = ">=3.4.2,<4"
tqdm = ">=4.67.1,<5"
hydra-core = ">=1.3.2,<2"
opencv = ">=4.8,<5"
natsort = ">=8.4.0,<9"
yacs = ">=0.1.8,<0.2"
ultralytics = "*"
spatialmath-python = "*"
sympy = "==1.13.1"
quaternion = ">=2024.0.13,<2025"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu118"]
index-strategy = "unsafe-best-match"

[pypi-dependencies]
torch = "==2.5.1"
torchvision = "==0.20.1"
torch-geometric = "==2.6.1"
torchmetrics = "==1.7.0"
matplotlib = "*"
scipy = "*"
einops = "*"
trimesh = "*"
tensorboard = "*"
pyglet = "<2"
scikit-learn = "*"
kornia = "*"
huggingface-hub = ">=0.22"
diffusers = ">=0.21.0"
gradio = "*"
h5py = "*"
wandb = "*"
prettytable = "*"
efficientnet-pytorch = "*"
warmup-scheduler = "*"
lmdb = "*"
vit-pytorch = "*"
positional-encodings = { version = "*", extras = ["pytorch"] }
