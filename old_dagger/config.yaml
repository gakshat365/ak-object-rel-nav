# Global Configuration for Iterative DAgger Failure Recovery

# Paths
paths:
  repo_root: "."
  dataset_root: "./data"
  hm3d_scenes_path: "./data/hm3d_v0.2"
  failures_source_csv: "./out/dagger/failure_trajectories_1300.csv"
  failures_cases_dir: "./dagger/data/trapped_cases"
  trapped_cases_csv: "./dagger/data/trapped_cases_manifest.csv"
  hm3d_eval_dir: "./out/hm3d_objectreact_eval"
  
  # Default pretrained model checkpoint
  base_checkpoint: "./dagger/model/baseline_model/latest.pth"
  controller_config: "./dagger/model/baseline_model/config.yaml"
  experiment_config: "./configs/object_react.yaml"
  
  # Output storage for DAgger runs
  output_dir: "./old_dagger/output"
  checkpoints_dir: "./old_dagger/checkpoints_initial_data"
  data_dir: "./old_dagger/data"
  manifests_dir: "./old_dagger/data/manifests_initial_data"
  logs_dir: "./old_dagger/logs_initial_data"

# DAgger Iterative Parameters
dagger:
  failure_source: "trapped_csv" # "trapped_csv" loads 50-step-back recovery poses from trapped_cases_csv
  num_iterations: 4
  # Action execution schedule: iter 0 (100% expert), iter 1 (60% expert), iter 2 (40% expert), iter 3 (0% expert)
  beta_schedule: [1.0, 0.6, 0.4, 0.0]
  
  # Split failure cases to avoid evaluation leakage
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  split_by_scene: true # strictly separate scenes between train, val, and held-out test
  seed: 42

# Environment and Simulation Parameters
simulation:
  env: "sim"
  width: 320
  height: 240
  hfov: 120
  sensor_height: 0.4
  sensor_height_map: 1.31
  time_delta: 0.25
  num_workers: 1
  
  # Success and step limits matching original benchmark evaluation
  threshold_goal_distance: 1.0 # inherits from configs/defaults.yaml
  max_rollout_steps: 300

# Action and Model Representation (aligned with ObjectReact / vint_dataset.py)
model:
  len_traj_pred: 10
  learn_angle: true
  normalize: true
  metric_waypoint_spacing: 0.5
  waypoint_spacing: 1
  context_size: 5
  image_size: [85, 64] # width, height

# Training Hyperparameters for Fine-Tuning
training:
  epochs_per_iter: 5
  batch_size: 32
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  num_workers: 0
  device: "cuda"
